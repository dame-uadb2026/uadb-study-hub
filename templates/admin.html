<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Administration - UADB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">UADB Study Hub (Espace Admin)</a>
            <a href="/logout" class="btn btn-danger btn-sm">Déconnexion</a>
        </div>
    </nav>
    <div class="container">
        <h3>Ajouter une nouvelle matière</h3>
        <form method="POST" action="/admin" class="card p-3 mb-4 shadow-sm">
            <div class="mb-2">
                <input type="text" name="title" class="form-control" placeholder="Titre de la matière" required>
            </div>
            <div class="row g-2 mb-2">
                <div class="col"><input type="text" name="level" class="form-control" placeholder="Niveau (ex: L1, L2)" required></div>
                <div class="col"><input type="text" name="filiere" class="form-control" placeholder="Filière (ex: Informatique)" required></div>
            </div>
            <div class="mb-2">
                <textarea name="description" class="form-control" placeholder="Description"></textarea>
            </div>
            <button type="submit" class="btn btn-success">Créer la matière</button>
        </form>
    </div>
</body>
                                                                                              </html>
